<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="/src/indicator.css">
  </head>
  <body>
    <div class="pill is-out" id="indicator" data-face="dots">
      <div class="face dots" id="dots" role="img" aria-label="Recording"></div>
      <div
        class="face notice"
        id="notice"
        data-kind="info"
        role="status"
        aria-live="polite"
      >
        <span
          class="dots notice-dots"
          id="notice-dots"
          aria-hidden="true"
        ></span>
        <span class="notice-icon" id="notice-icon" aria-hidden="true"></span>
        <span class="notice-text" id="notice-text"></span>
      </div>
    </div>
    <script type="module" src="/src/indicator.ts"></script>
  </body>
</html>
